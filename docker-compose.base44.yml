name: yas-sports

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: yas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yas_local_dev_pw}
      POSTGRES_DB: yas_sports
    volumes:
      - yas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yas -d yas_sports"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:22
    restart: on-failure
    working_dir: /app/api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      PORT: 4000
      UPLOAD_DIR: /data/uploads
      NODE_ENV: development
      BASE44_PREVIEW_MODE:
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - yas_api_node_modules:/app/api/node_modules
      - yas_uploads:/data/uploads
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_TARGET: http://api:4000
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - yas_web_node_modules:/app/web/node_modules
    ports:
      - "3000:3000"
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  yas_pgdata:
  yas_api_node_modules:
  yas_web_node_modules:
  yas_uploads:
